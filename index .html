<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Records Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f6f9;
        }

        .title {
            font-weight: bold;
        }

        .table th {
            background-color: #212529;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        
        <div class="text-center mb-4">
            <h1 class="title">Student Records Management</h1>

            
        </div>


        <div class="card shadow p-4 mb-4">

            <h4 class="mb-3">Student Details</h4>

            <form id="studentForm">

                <div class="row">

                    
                    <div class="col-md-4 mb-3">

                        <label class="form-label"> Student ID</label>

                        <input type="text" id="studentId" class="form-control" placeholder="Enter Student ID" required>

                    </div>


                     <div class="col-md-4 mb-3">

                        <label class="form-label">  Name </label>

                        <input type="text" id="studentName" class="form-control" placeholder="Enter Student Name"  required >

                    </div>


                    
                    <div class="col-md-4 mb-3">

                        <label class="form-label"> Course </label>

                        <input type="text"  id="studentCourse" class="form-control" placeholder="Enter  Student Course" required >

                    </div>

                </div>


                
                <button type="submit" id="submitBtn" class="btn btn-primary">
                    Add Student
                </button>


                <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;" >
                    Cancel
                </button>

            </form>

        </div>



        
        <div class="card shadow p-4">

            <h4 class="mb-3">Student Records</h4>


            <div class="table-responsive">

                <table class="table table-bordered table-hover text-center">

                    <thead>

                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Edit/Delete</th>
                        </tr>

                    </thead>


                    <tbody id="studentTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>



    
    <script>

        

        const studentForm =
            document.getElementById("studentForm");

        const studentId =
            document.getElementById("studentId");

        const studentName =
            document.getElementById("studentName");

        const studentCourse =
            document.getElementById("studentCourse");

        const studentTableBody =
            document.getElementById("studentTableBody");

        const submitBtn =
            document.getElementById("submitBtn");

        const cancelBtn =
            document.getElementById("cancelBtn");




        let students =
            JSON.parse(localStorage.getItem("students")) || [];


       
        let editIndex = -1;




        displayStudents();




        studentForm.addEventListener("submit", function(event) {

           
            event.preventDefault();


           
            const id = studentId.value.trim();

            const name = studentName.value.trim();

            const course = studentCourse.value.trim();



            
            const student = {

                id: id,

                name: name,

                course: course

            };



           

            if (editIndex === -1) {

                students.push(student);

                alert("Student added successfully!");

            }



            else {

                students[editIndex] = student;

                alert("Student updated successfully!");

                editIndex = -1;

                submitBtn.textContent = "Add Student";

                cancelBtn.style.display = "none";

            }



            

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );



           
            displayStudents();



           
            studentForm.reset();

        });



        

        function displayStudents() {

           
            studentTableBody.innerHTML = "";


            students.forEach(function(student, index) {


                const row = `
                    <tr>

                        <td>
                            ${student.id}
                        </td>

                        <td>
                            ${student.name}
                        </td>

                        <td>
                            ${student.course}
                        </td>

                        <td>

                            <button
                                class="btn btn-warning btn-sm me-1"
                                onclick="editStudent(${index})"
                            >
                                Edit
                            </button>


                            <button
                                class="btn btn-danger btn-sm"
                                onclick="deleteStudent(${index})"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>
                `;



                studentTableBody.innerHTML += row;

            });

        }



        function editStudent(index) {

            const student = students[index];



            
            studentId.value = student.id;

            studentName.value = student.name;

            studentCourse.value = student.course;



       
            editIndex = index;



           
            submitBtn.textContent = "Update Student";



            
            cancelBtn.style.display = "inline-block";



           
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }



        function deleteStudent(index) {

            
            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this student information?"
                );



            if (confirmDelete) {

              
                students.splice(index, 1);



               
                localStorage.setItem(
                    "students",
                    JSON.stringify(students)
                );



                
                displayStudents();



                alert("Student deleted successfully!");

            }

        }



        

        cancelBtn.addEventListener("click", function() {

            
            editIndex = -1;



            studentForm.reset();



           
            submitBtn.textContent = "Add Student";



           
            cancelBtn.style.display = "none";

        });

    </script>

</body>

</html>
